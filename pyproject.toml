[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dompk"
version = "0.0.2"
description = "Dompack - curated domain-based Python tech stack installer"
authors = [{ name = "Veeresh Hanni", email = "veereshhanni347@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
dompack = "dompack.cli:main"
dompk = "dompack.cli:main"

[project.optional-dependencies]
db = ["psycopg2-binary", "pymysql", "pymongo", "motor", "redis"]
da = ["psycopg2-binary", "pymysql", "pymongo", "motor", "redis"]

ds = ["numpy", "pandas", "matplotlib", "scipy", "statsmodels"]
ml = ["numpy", "pandas", "scikit-learn", "joblib", "matplotlib"]
ai = ["transformers", "sentencepiece", "tokenizers"]
dl = [
  "torch; python_version >= '3.9' and python_version < '3.14'",
  "torchvision; python_version >= '3.9' and python_version < '3.14'",
]
cv = ["opencv-python; platform_python_implementation == 'CPython'", "scikit-image", "pillow"]

gui = ["PyQt5; python_version < '3.13'", "kivy; python_version < '3.13'"]
av = ["librosa", "moviepy", "ffmpeg-python"]
web = ["requests", "httpx", "beautifulsoup4", "lxml"]

common = ["requests", "httpx", "python-dotenv", "pydantic", "rich", "loguru"]
core = ["requests", "httpx", "python-dotenv", "pydantic", "rich", "loguru"]
base = ["requests", "httpx", "python-dotenv", "pydantic", "rich", "loguru"]
bootstrap = ["pip", "setuptools", "wheel", "build", "packaging", "virtualenv", "pip-tools", "twine"]
boot = ["pip", "setuptools", "wheel", "build", "packaging", "virtualenv", "pip-tools", "twine"]
pytools = ["pip", "setuptools", "wheel", "build", "packaging", "virtualenv", "pip-tools", "twine"]

fa = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "python-dotenv",
  "python-multipart",
  "jinja2",
  "sqlalchemy",
]
fastapi = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "python-dotenv",
  "python-multipart",
  "jinja2",
  "sqlalchemy",
]

fl = ["Flask", "Flask-CORS", "Flask-RESTful", "Flask-JWT-Extended", "Flask-Migrate"]
flask = ["Flask", "Flask-CORS", "Flask-RESTful", "Flask-JWT-Extended", "Flask-Migrate"]

dj = ["Django", "djangorestframework", "django-cors-headers", "django-environ", "whitenoise"]
django = ["Django", "djangorestframework", "django-cors-headers", "django-environ", "whitenoise"]

net = ["aiohttp", "websockets", "dnspython", "paramiko"]

security = ["cryptography", "PyJWT", "passlib[bcrypt]", "pycryptodome"]
sec = ["cryptography", "PyJWT", "passlib[bcrypt]", "pycryptodome"]
auth = ["cryptography", "PyJWT", "passlib[bcrypt]", "pycryptodome"]
cyber = ["cryptography", "PyJWT", "passlib[bcrypt]", "pycryptodome"]
cybersec = ["cryptography", "PyJWT", "passlib[bcrypt]", "pycryptodome"]

devops = ["docker", "docker-compose", "ansible"]
testing = ["pytest", "pytest-cov", "black", "flake8", "isort", "mypy"]
